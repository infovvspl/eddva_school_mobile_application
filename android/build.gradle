buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        // NOTE: this value is NOT what actually controls the Kotlin Gradle
        // Plugin applied to the build -- @react-native/gradle-plugin (bundled
        // with this RN version) hard-pins Kotlin 2.0.21 in its own version
        // catalog regardless of this variable. This var is only read by
        // @react-native-async-storage/async-storage's config.gradle to pick a
        // matching KSP release, and its supported list starts at 2.1.0 --
        // one version higher than what RN 0.77.3 actually applies -- so the
        // two disagree and kspDebugKotlin fails with a binary-incompatible
        // NoSuchMethodError. Real fix is downgrading async-storage to a
        // release that supports Kotlin 2.0.x, or bumping the Kotlin version
        // RN's own gradle-plugin applies (higher-risk, touches node_modules).
        kotlinVersion = "2.0.21"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"
